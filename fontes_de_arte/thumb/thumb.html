<!doctype html>
<!-- Thumb de divulgação do jogo. Gerada por gerar_thumb.py (Playwright): ?f=grande (1280×720) ou ?f=capa (630×500, itch.io). -->
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
@font-face { font-family: Baloo; font-weight: 800; src: url(../../node_modules/@fontsource/baloo-2/files/baloo-2-latin-800-normal.woff2); }
@font-face { font-family: Nunito; font-weight: 700; src: url(../../node_modules/@fontsource/nunito/files/nunito-latin-700-normal.woff2); }
@font-face { font-family: Nunito; font-weight: 800; src: url(../../node_modules/@fontsource/nunito/files/nunito-latin-800-normal.woff2); }
:root { --fundo: #0c1a24; --lima: #8fd651; --aqua: #4fd6d0; --texto: #eef6f8; }
* { box-sizing: border-box; margin: 0; }
body { width: 1280px; height: 720px; overflow: hidden; background: var(--fundo); font-family: Nunito, sans-serif; color: var(--texto); position: relative; }
/* fundo: o túnel, escurecido, com brilho aqua */
.fundo { position: absolute; inset: 0; background: url(../../docs/telas/06_tunel.jpg) center/cover; filter: saturate(1.2) brightness(.55); }
.veu { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(12,26,36,.97) 0%, rgba(12,26,36,.88) 42%, rgba(12,26,36,.25) 75%, rgba(12,26,36,.55) 100%); }
.texto { position: absolute; left: 64px; top: 0; bottom: 0; width: 620px; display: flex; flex-direction: column; justify-content: center; }
.logo { width: 120px; height: 120px; margin: 0 0 6px -14px; filter: drop-shadow(0 0 24px rgba(143,214,81,.45)); }
.antes { font: 800 40px/1 Baloo, sans-serif; color: var(--aqua); letter-spacing: .5px; }
.nome { font: 800 104px/.92 Baloo, sans-serif; color: var(--lima); text-shadow: 0 6px 0 #2c5a17, 0 0 40px rgba(143,214,81,.35); margin: 6px 0 18px; white-space: nowrap; }
.nome span { color: var(--texto); text-shadow: 0 6px 0 #26414f, 0 0 40px rgba(79,214,208,.3); }
.frase { font: 700 26px/1.3 Nunito, sans-serif; color: #cfe3ea; max-width: 560px; margin-bottom: 26px; }
.selos { display: flex; gap: 12px; flex-wrap: wrap; }
.selo { font: 800 22px/1 Nunito, sans-serif; padding: 12px 18px; border-radius: 999px; border: 3px solid var(--aqua); color: var(--aqua); background: rgba(12,26,36,.75); }
.selo.vr { background: var(--lima); border-color: var(--lima); color: #0c1a24; }
/* três telas do jogo, inclinadas */
.tela { position: absolute; width: 440px; aspect-ratio: 16/9; border-radius: 18px; overflow: hidden; border: 5px solid var(--texto); box-shadow: 0 18px 40px rgba(0,0,0,.6); background: center/cover; }
.t1 { right: 90px; top: 34px; transform: rotate(4deg); background-image: url(../../docs/telas/05_portal.jpg); border-color: var(--aqua); }
.t2 { right: 34px; top: 236px; transform: rotate(-5deg); background-image: url(../../docs/telas/03_treinamento.jpg); border-color: var(--lima); z-index: 2; }
.t3 { right: 110px; top: 446px; transform: rotate(3deg); background-image: url(../../docs/telas/04_oficina.jpg); }
/* variante capa (630×500) */
body.capa { width: 630px; height: 500px; }
.capa .veu { background: linear-gradient(180deg, rgba(12,26,36,.35) 0%, rgba(12,26,36,.9) 55%, rgba(12,26,36,.98) 100%); }
.capa .texto { left: 34px; right: 34px; width: auto; top: auto; bottom: 30px; justify-content: flex-end; }
.capa .logo { display: none; }
.capa .antes { font-size: 28px; }
.capa .nome { font-size: 70px; margin: 2px 0 12px; }
.capa .frase { display: none; }
.capa .selo { font-size: 17px; padding: 9px 13px; }
.capa .tela { width: 300px; border-width: 4px; }
.capa .t1 { right: 26px; top: 24px; }
.capa .t2 { right: auto; left: 30px; top: 40px; }
.capa .t1 { top: 30px; }
.capa .t3 { display: none; }
</style></head>
<body>
<div class="fundo"></div><div class="veu"></div>
<div class="tela t1"></div><div class="tela t2"></div><div class="tela t3"></div>
<div class="texto">
  <img class="logo" src="../../public/imagens/gabura-escuro-512.png" alt="">
  <div class="antes">Experiência VR no</div>
  <div class="nome">Gabura<span>VERSO</span></div>
  <div class="frase">Ajude a tripulação a consertar a nave, capture clones fujões e acenda as três luzes para voltar para casa.</div>
  <div class="selos"><div class="selo vr">Feito para VR · Meta Quest 3S</div><div class="selo">Versão adaptada para PC</div><div class="selo">Funciona offline</div></div>
</div>
<script>if (new URLSearchParams(location.search).get('f') === 'capa') document.body.classList.add('capa');</script>
</body></html>
